name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days at 06:00 UTC — well under Supabase's 7-day free-tier
    # auto-pause window, so the project never sits idle long enough to pause.
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://volydinbgoelrtfzbeck.supabase.co/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: sb_publishable_153a1iqYQdboXq2lJ7HpAg_m2sZT3IG")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 500 ]; then
            echo "::warning::Supabase project may be paused or unreachable (HTTP $status)"
          fi
