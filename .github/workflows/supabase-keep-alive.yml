name: Supabase Keep-Alive

on:
  schedule:
    # Daily at 06:00 UTC. Previously ran every 3 days, but the project
    # still auto-paused on 2026-09-10 despite that — a plain anonymous
    # SELECT via PostgREST evidently isn't reliable signal for Supabase's
    # own inactivity tracker even when it reaches the real backend
    # (confirmed non-cached, real query time). Running daily as extra
    # insurance, and any non-200 result now fails the job (not just a
    # warning) so GitHub's default failed-scheduled-workflow email fires.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          http_status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://volydinbgoelrtfzbeck.supabase.co/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: sb_publishable_153a1iqYQdboXq2lJ7HpAg_m2sZT3IG") || http_status="000"
          echo "Supabase responded with HTTP $http_status"
          if [ "$http_status" != "200" ]; then
            echo "::error::Supabase project unreachable or erroring (HTTP $http_status) — it may be paused. Check the dashboard."
            exit 1
          fi
