m the ear canal using a modern electronic irrigator.","name":"Ear Irrigation","provider":{"@id":"https://www.cmearwaxremoval.co.uk/#business"}},"priceCurrency":"GBP"},{"@type":"Offer","itemOffered":{"@type":"Service","description":"Hard or oddly-positioned wax cleared by hand, using fine precision instruments under close magnification.","name":"Manual Removal","provider":{"@id":"https://www.cmearwaxremoval.co.uk/#business"}},"priceCurrency":"GBP"}],"name":"Ear Care Services"},"image":"https://www.cmearwaxremoval.co.uk/logo-badge.png","name":"CM Ear Wax Removal","openingHoursSpecification":[{"@type":"OpeningHoursSpecification","closes":"18:00","dayOfWeek":["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],"opens":"08:00"}],"paymentAccepted":"Cash, Bank Transfer","sameAs":[],"telephone":"+44 7491 024311","url":"https://www.cmearwaxremoval.co.uk/"},{"@id":"https://www.cmearwaxremoval.co.uk/#faq","@type":"FAQPage","mainEntity":[{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"CM Ear Wax Removal is a mobile service based in Bentley, Hampshire. Cristiana covers a 10+ mile radius including Farnham, Alton, Odiham, Bordon, Haslemere, Liphook, Hindhead, Aldershot and Godalming."},"name":"Where does CM Ear Wax Removal cover?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Please get in touch via WhatsApp for current pricing on microsuction, ear irrigation and manual removal — we're happy to confirm costs before you book."},"name":"How much does ear wax removal cost?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"The easiest way to book is via WhatsApp. You can also send an enquiry through the contact form on this website. Cristiana brings all equipment and comes to your home, residential home or care home."},"name":"How do I book an appointment?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Microsuction uses gentle suction under magnified vision to lift wax out without any water, making it suitable even for those with a perforated eardrum or grommets. Ear irrigation uses a controlled, low-pressure warm water flow to flush out softened wax. Manual removal clears hard or oddly-positioned wax by hand, using fine precision instruments under close magnification. All three are safe, well-established techniques, and are often combined within the same visit depending on what your ears need."},"name":"What is the difference between microsuction, ear irrigation and manual removal?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Using a few drops of olive or almond oil in the affected ear for 3-5 days beforehand softens the wax and makes removal quicker and more comfortable. It's especially recommended before ear irrigation, though not always essential before microsuction."},"name":"Do I need to use olive oil drops before my appointment?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Both procedures are generally painless and well tolerated. Microsuction is usually the most comfortable option since no water is used. If you have any ear pain, an active infection or a perforated eardrum, please let us know before booking."},"name":"Is microsuction or ear irrigation painful?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Yes. CM Ear Wax Removal visits private homes, residential homes and care homes across the Bentley and Hampshire coverage area."},"name":"Do you visit care homes and residential homes?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Yes — wax build-up is a common cause of muffled sound and feedback in hearing aid users, and removing it often improves hearing aid performance. Please mention that you wear hearing aids when you book."},"name":"Is it safe to have ear wax removed if I wear hearing aids?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Cotton buds tend to compact wax deeper into the ear canal rather than removing it, which can worsen a blockage and risks injury to the ear. Wax removal is best left to a trained professional with the right tools for the job."},"name":"Why shouldn't I use cotton buds to clean my ears?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Yes. Cristiana uses a video otoscope at every visit, displaying live footage of your ear canal on a small screen so you can follow along as the wax is examined and removed."},"name":"Will I be able to see what's happening during my appointment?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"CM Ear Wax Removal welcomes clients of all ages, from children old enough to sit still for a few minutes through to elderly residents in care homes."},"name":"Do you see children, or only adults?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Yes. Blocked ears are a common, treatable cause of tinnitus, a feeling of fullness, and dizziness. These symptoms can often be resolved simply by having the wax safely removed."},"name":"Can earwax build-up cause dizziness or tinnitus?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Hearing loss is recognised as one of the most significant modifiable risk factors for dementia, and research shows that treating hearing loss can meaningfully reduce that risk. Keeping ears clear of wax build-up is a simple part of supporting long-term hearing and cognitive health, which is part of why CM Ear Wax Removal visits residential and care homes."},"name":"Why is ear health especially important for elderly relatives?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"No referral is needed. Many GP surgeries no longer offer ear wax removal on the NHS, or have long waiting lists for it, so you can book directly with CM Ear Wax Removal. If anything beyond straightforward wax build-up is found during your visit, you'll always be advised to follow up with your GP or an ENT specialist."},"name":"Do I need a referral from my GP to book?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"Yes. Visits to retirement and care homes are arranged directly with the home's manager or with family members, and several residents can be seen during the same visit."},"name":"Can you visit multiple residents at a retirement or care home in one trip?"}]}]}</script><body>
