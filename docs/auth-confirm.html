<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none';" />
  <title>Signing in — CM Ear Wax Removal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0E2A30;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
    }
    img { display: block; margin: 0 auto 24px; border-radius: 50%; }
    h1 {
      font-weight: 500;
      font-size: 1.4rem;
      color: #4FC3D9;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }
    p {
      font-size: 0.95rem;
      color: #9FC4CB;
      margin-bottom: 28px;
    }
    a {
      display: inline-block;
      background: #0E5C68;
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 4px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }
    .tick {
      font-size: 2.5rem;
      color: #4FC3D9;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo-badge.png" width="56" height="56" alt="CM Ear Wax Removal" />
    <div class="tick">✓</div>
    <h1>Account confirmed</h1>
    <p>Your admin account is ready.<br>Click below to sign in.</p>
    <a href="admin.html">Go to Admin</a>
  </div>
  <script>
    // If Supabase tokens are in the hash, redirect to admin so it can pick them up
    if (window.location.hash && window.location.hash.includes('access_token')) {
      window.location.replace('admin.html' + window.location.hash);
    }
  </script>
</body>
</html>
